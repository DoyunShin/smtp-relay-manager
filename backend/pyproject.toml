[project]
name = "smtp-relay-manager"
version = "0.1.0"
description = "Domain-scoped authenticated SMTP relay"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncmy>=0.2,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "aiosmtpd>=1.4.6,<2", "aiosmtplib>=5,<6", "cryptography>=44",
  "argon2-cffi>=23",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/smtp_relay_manager"]
